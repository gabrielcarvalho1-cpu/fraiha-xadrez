# FRAIHA Xadrez · montagem do app de iPhone no Mac do Codemagic (codemagic.io).
# Fase 1 (sem conta paga da Apple): monta para o SIMULADOR de iPhone, sem assinatura, roda o jogo no
# iPhone virtual e guarda prints das telas como artefatos da montagem.
# Fase 2 (com a conta Apple Developer): fluxo "ios-testflight" com assinatura automática e envio ao TestFlight
# (entra quando a conta for aprovada; as chaves ficam só nas variáveis do Codemagic, nunca neste arquivo).
workflows:
  ios-simulador:
    name: iPhone · simulador (sem conta Apple)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:            # monta sozinho a cada envio para a branch do iPhone (sem precisar clicar)
      events:
        - push
      branch_patterns:
        - pattern: ios/app
          include: true
    environment:
      xcode: "16.4"   # simulador iOS 18: ainda roda app x86_64 (o iOS 26 não roda mais)
      vars:
        GODOT_VERSION: "4.5.1"
    scripts:
      - name: Baixar o Godot e os templates de iPhone
        script: |
          set -e
          V="${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_macos.universal.zip"
          unzip -q godot.zip
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j tpl.tpz "templates/ios.zip" "templates/version.txt" -d "$T"
      - name: Montar o plugin nativo do iPhone (foto de perfil + voz Agora)
        script: |
          bash ios_plugin/build_ios_plugin.sh
      - name: Gerar o projeto Xcode
        script: |
          set -e
          G="$PWD/Godot.app/Contents/MacOS/Godot"
          "$G" --headless --path . --import > import.log 2>&1 || true
          mkdir -p build/ios
          "$G" --headless --path . --export-release "iOS" build/ios/FRAIHA.ipa 2>&1 | tee export.log
          ls build/ios
      - name: Compilar para o simulador
        script: |
          set -eo pipefail
          # Godot 4.5.1: a biblioteca do simulador é só x86_64 → monta x86_64 (o Mac M2 roda pelo Rosetta)
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          cd build/ios
          xcodebuild -project FRAIHA.xcodeproj -scheme FRAIHA -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 EXCLUDED_ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build | tail -40
      - name: Rodar no iPhone virtual e testar os modos
        script: |
          set -e
          APP=$(find build/ios/dd/Build/Products -name "*.app" -maxdepth 2 | head -1)
          RT=$(xcrun simctl list runtimes | grep -E "^iOS 1[78]" | tail -1 | sed -E 's/.* - (com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+).*/\1/')
          echo "runtime: $RT"
          DEV=$(xcrun simctl create fraiha "iPhone 15" "$RT")
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b > /dev/null
          xcrun simctl install "$DEV" "$APP"
          mkdir -p prints
          # o Mac da nuvem não tem placa de som: áudio "mudo". --fx-teste-modos: o próprio jogo entra como convidado,
          # abre xadrez × computador, MARCHA REAL, XEQUE e Online Casual, tira os prints e escreve um diário.
          xcrun simctl launch --console-pty "$DEV" com.fraihaxadrez.app --audio-driver Dummy -- --fx-teste-modos > prints/console.log 2>&1 &
          sleep 20
          xcrun simctl io "$DEV" screenshot prints/00_abertura.png
          D=$(xcrun simctl get_app_container "$DEV" com.fraihaxadrez.app data)
          for i in $(seq 1 60); do
            DI=$(find "$D" -name diario.txt 2>/dev/null | head -1)
            if [ -n "$DI" ] && grep -q "FIM" "$DI"; then break; fi
            sleep 6
          done
          DI=$(find "$D" -name diario.txt 2>/dev/null | head -1)
          [ -n "$DI" ] && cp "$(dirname "$DI")"/*.jpg prints/ 2>/dev/null || true
          [ -n "$DI" ] && cp "$DI" prints/diario.txt || echo "sem diario do teste"
          xcrun simctl io "$DEV" screenshot prints/99_final.png
      - name: Prints em texto (para conferir sem baixar)
        script: |
          echo "--- diario do teste"
          cat prints/diario.txt 2>/dev/null || echo "sem diario"
          for f in prints/*.png; do
            sips -s format jpeg -s formatOptions 40 -Z 520 "$f" --out "${f%.png}.jpg" > /dev/null
          done
          for f in prints/*.jpg; do
            echo "IMG $(basename "$f") $(base64 -i "$f" | tr -d '\n')"
          done
          tail -30 prints/console.log || true
          echo "--- plugin nativo (FraihaVoice / GDExtension)"
          grep -iE "gdextension|fraiha_ios|FraihaVoice|AgoraRtcKit|dyld" prints/console.log | head -20 || echo "sem avisos do plugin"
      - name: Diagnostico (se o app fechar sozinho)
        script: |
          DEV=$(xcrun simctl list devices | grep fraiha | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "--- log do Godot (user://logs)"
          D=$(xcrun simctl get_app_container "$DEV" com.fraihaxadrez.app data 2>/dev/null)
          find "$D" -name "godot*.log" -exec tail -60 {} \; 2>/dev/null || true
          echo "--- plugin nativo carregou?"
          find "$D" -name "fx_teste_plugin.txt" -exec cat {} \; 2>/dev/null || echo "sem bilhete do plugin"
          APP=$(find build/ios/dd/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "--- Frameworks dentro do app"
          ls "$APP/Frameworks" 2>/dev/null || echo "sem pasta Frameworks"
          echo "--- relatorio de falha"
          F=$(ls -t ~/Library/Logs/DiagnosticReports/FRAIHA* 2>/dev/null | head -1)
          [ -n "$F" ] && head -120 "$F" | grep -v "^ *0x" || echo "sem relatorio"
          echo "--- log do sistema"
          xcrun simctl spawn "$DEV" log show --last 6m --style compact --predicate 'process == "FRAIHA"' 2>/dev/null | tail -60 || true
    artifacts:
      - prints/*
      - export.log
      - build/ios/dd/Build/Products/**/*.app
